<nav class="navbar">
  <div class="navbar-container">
    
    <!-- LOGO -->
    <a class="logo" routerLink="/home">Dali</a>

    <!-- DESKTOP NAV -->
    <ul class="nav-links">
      <li>
        <a routerLink="/home" routerLinkActive="active">Home</a>
      </li>

      <li>
        <a routerLink="/about" routerLinkActive="active">About Me</a>
      </li>

      <li>
        <a routerLink="/projects" routerLinkActive="active">Projects</a>
      </li>

      <li>
        <a routerLink="/reviewspage" routerLinkActive="active">Reviews</a>

      <li>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
      </li>

      <li>
        <a routerLink="/cv" routerLinkActive="active">CV</a>
      </li>

      <li>
        <button

        </button>

        <button 
          class="admin-icon-btn admin-logout" 
          *ngIf="isAdmin"

          title="Admin Logout">
          <i class="fa-solid fa-unlock-keyhole"></i>
        </button>

    </ul>

    <div class="hamburger" (click)="toggleMenu()">
      <span></span>

      <span></span>

  <!-- MOBILE MENU -->
  <ul class="mobile-menu" [class.open]="menuOpen">

    <li>
      <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
    </li>

    <li>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Me</a>

    <li>

    </li>

    <li>
      <a routerLink="/cv" routerLinkActive="active" (click)="closeMenu()">CV</a>
    </li>

    <li>
      <button 
        class="admin-icon-btn" 
        *ngIf="!isAdmin" 
        (click)="enableAdmin()" 
        title="Admin login">
        <i class="fa-solid fa-key"></i>
      </button>

      <button 
        class="admin-icon-btn admin-logout" 
        *ngIf="isAdmin"
