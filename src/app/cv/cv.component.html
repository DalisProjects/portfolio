<div class="cv-container">

  <!-- Language Switcher -->
  <div class="lang-buttons">
    <button class="btn btn-lang en" (click)="switchLanguage('en')">
      🇺🇸 English
    </button>
    <button class="btn btn-lang it" (click)="switchLanguage('it')">
      🇮🇹 Italiano
    </button>
  </div>

  <!-- Embedded PDF using browser's default viewer -->
  <iframe
    class="cv-frame"
    [src]="safeCvUrl"
  ></iframe>

  <!-- Bottom buttons -->
  <div class="cv-buttons">

    <!-- Download PDF -->
    <a
      [href]="cvUrl"
      download
      class="btn btn-primary"
    >
      Download CV
    </a>

    <!-- Open in new tab (mobile / weird browsers will use this) -->
    <a
      [href]="cvUrl"
      target="_blank"
      rel="noopener"
      class="btn btn-secondary"
    >
      Open in New Tab
    </a>

    <a routerLink="/home" class="btn btn-secondary">
      Back to Home
    </a>

  </div>
</div>
